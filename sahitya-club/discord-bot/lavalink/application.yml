server:
  port: ${PORT:2333}
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # Keep LavaSrc present: the AAC SoundCloud extension links against its classes.
    # Spotify remains unused; no Spotify credentials or Premium account are configured.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: false
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # No OAuth or Google account is configured. These public clients are tried in order.
    clients:
      - IOS
      - WEB
      - MWEB
      - ANDROID_VR
      - WEBEMBEDDED
      - ANDROID_MUSIC
      - ANDROID
      - MUSIC
